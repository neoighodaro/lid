# lid sandbox configuration
#
# nono runs the agent as a caged host process, so this file describes what the
# agent may reach on your machine. Keys that describe an image or what lid puts
# inside one - base_image, template, packages, workspace, bridges, claude,
# memory - do not apply here.

name: {{ .Name }}
agent: claude-code
backend: nono

# Language runtimes this project uses. nono installs nothing: declaring one
# grants the host's toolchain and lets its package manager write its cache.
{{- if .Runtimes }}
runtimes:
{{- range .Runtimes }}
  {{ .Name }}: "{{ .Version }}"
{{- end }}
{{- else }}
runtimes: {}
  # node: "24"
  # pnpm: "11"
  # bun: "1.4.0"
  # python: "3.12"
  # go: "1.27"
  # php: "8.5"
  # rust: "1.98.0"
{{- end }}

# How much of the network the sandbox may reach. minimal is the LLM endpoints
# only; developer adds package registries, GitHub, GitLab, sigstore and
# documentation; enterprise adds the cloud provider APIs. Left out, the agent
# above picks the profile nono maintains for it.
# network_profile: developer

# Extra hosts to allow, on top of whatever the profile above reaches.
network: []
  # - "*.npmjs.org"
  # - "api.github.com"

# Ports the sandboxed process may listen on. nono cannot remap one, so a
# host:sandbox pair listens on the sandbox port as itself.
ports: []
  # - 3000

# Commands the sandbox denies by default that this project needs. nono lifts
# them a group at a time, so allowing one unblocks the rest of its group -
# 'lid start' prints exactly what each entry widens.
allow_commands: []
  # - npm
  # - pip
  # - brew

# Cross-sandbox questions. Run the broker with 'lid handoff -D', then the agent
# can ask agents in other sandboxes and answer theirs. A nono session runs in
# your own home, so lid will not install the agent skill there uninvited - run
# 'lid handoff --install-skill' once to teach the agent how to use this.
handoff:
  enabled: false
  # url: http://localhost:8787

# Inline environment variables.
env: {}
  # NODE_ENV: development

# Environment files, loaded in order; later files win. Inline 'env' above
# overrides all of them.
env_file: []
  # - .env
  # - .env.sandbox

# Commands run on your host at lifecycle points, from the project directory.
scripts:
  # Once, the first time lid starts this project.
  on_create: []
    # - pnpm install

  # On every start. Must be idempotent.
  on_start: []
    # - ./scripts/warm-cache.sh

# Name for this project's zellij tab, when lid starts inside zellij.
# zellij:
#   display_name: my-project

# What 'lid shell' opens. Set either key and the shell becomes bash, so it can
# be handed an init file; leave both unset and you keep your own shell.
shell:
  # Working directory when opening a shell.
  # directory: /path/to/project

  # Aliases, added alongside the ones your own shell already defines.
  aliases: {}
    # g: git
