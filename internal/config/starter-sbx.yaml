# lid sandbox configuration

name: {{ .Name }}
agent: claude-code
backend: sbx

# Base image the generated Dockerfile builds on.
# base_image: docker/sandbox-templates:claude-code-minimal

# Copy the project to this directory inside the sandbox after creation.
# When unset, the project stays at the mirrored host path.
# workspace: /workspace

# Custom template image, which skips Dockerfile generation. When set,
# 'packages', 'runtimes' and 'bridges' are unavailable - install and wire
# them up in your own Dockerfile instead.
# template: docker.io/my-org/custom-template:v1

# System packages, installed with apt-get.
packages: []
  # - ripgrep
  # - jq
  # - xz-utils

# Language runtimes.
{{- if .Runtimes }}
runtimes:
{{- range .Runtimes }}
  {{ .Name }}: "{{ .Version }}"
{{- end }}
{{- else }}
runtimes: {}
  # node: "24"
  # pnpm: "11"
  # bun: "1.4.0"
  # python: "3.12"
  # go: "1.27"
  # php: "8.5"
  # rust: "1.98.0"
{{- end }}

# PHP extensions, installed on top of php-cli. Nothing is installed by
# default - list what your project actually needs.
# php:
#   extensions:
#     - sqlite3
#     - imagick

# Ports published from the sandbox to the host.
ports: []
  # - 3000
  # - "8080:80"
  # - "5432:5432/tcp"

# Inline environment variables.
env: {}
  # NODE_ENV: development

# Environment files, loaded in order; later files win. Inline 'env' above
# overrides all of them.
env_file: []
  # - .env
  # - .env.sandbox

# Network allowlist. Only these host patterns are reachable.
network: []
  # - "*.npmjs.org"
  # - "api.github.com"

# Commands run inside the sandbox at lifecycle points.
scripts:
  # Once, right after the sandbox is created.
  on_create: []
    # - pnpm install

  # On every start, including resume after a stop. Must be idempotent.
  on_start: []
    # - ./scripts/warm-cache.sh

# Cross-sandbox questions. Run the broker on your host with 'lid handoff -D',
# then the agent can ask agents in other sandboxes and answer theirs.
handoff:
  enabled: false
  # url: http://host.docker.internal:8787

# Host services reachable inside the sandbox under a stable name and port, so
# the project's .env needs no sandbox-specific edits. lid opens host_port in the
# sandbox's network policy and installs socat for you.
bridges: []
  # - name: postgres
  #   port: 5432
  #   host_port: 5432
  #   env: DB_HOST

# What 'lid shell' opens. A one-off 'lid shell -- <command>' gets the directory
# below; the aliases are for the interactive shell only.
shell:
  # Working directory when opening a shell.
  # directory: /home/agent/project

  # Aliases, added alongside the ones the image already defines.
  aliases: {}
    # g: git

# Claude Code customization. Ignored by other agents.
claude:
  plugins:
    marketplaces: []
      # - anthropics/claude-plugins-official
    install: []
      # - superpowers@claude-plugins-official

  # Merged into the agent's settings.json.
  settings: {}
    # alwaysThinkingEnabled: true

# Instructions injected into the agent's memory file.
# memory: |
#   Project-specific instructions here.
