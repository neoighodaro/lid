# lid sandbox configuration

name: {{ .Name }}
agent: claude-code
backend: sbx

# Base image the generated Dockerfile builds on.
# base_image: docker/sandbox-templates:claude-code-minimal

# A second name for the project inside the sandbox: a symlink to the mirrored
# host path, where shells and on_start scripts begin. Nothing is copied, and
# the project stays reachable at the host path either way.
# workspace: /workspace

# Work on a git clone kept on the sandbox's own disk instead of sharing the
# host's copy. The project keeps the same path, but the agent's commits come
# back over the 'sandbox-<name>' git remote rather than appearing in your
# editor. Worth it when a dev server churns files: the shared mount can go
# stale under load, and after that nothing in the sandbox can read its own
# working directory until the sandbox restarts.
# clone: true

# CPUs and memory for the sandbox. By default sbx gives it every host CPU and
# half the host's memory. Changing them takes 'lid start --rebuild'.
# resources:
#   cpus: 4
#   memory: 8g

# Host directories mounted beside the project: HOST, HOST:ro,
# HOST:SANDBOX_PATH or HOST:SANDBOX_PATH:ro. Without a SANDBOX_PATH the
# directory keeps its host path inside the sandbox.
extra_workspaces: []
  # - ~/Developer/shared-lib:ro
  # - ~/datasets:/workspace/data

# Custom template image, which skips Dockerfile generation. When set,
# 'packages', 'runtimes' and 'bridges' are unavailable - install and wire
# them up in your own Dockerfile instead.
# template: docker.io/my-org/custom-template:v1

# System packages, installed with apt-get.
packages: []
  # - ripgrep
  # - jq
  # - xz-utils

# Language runtimes.
{{- if .Runtimes }}
runtimes:
{{- range .Runtimes }}
  {{ .Name }}: "{{ .Version }}"
{{- end }}
{{- else }}
runtimes: {}
  # node: "24"
  # pnpm: "11"
  # bun: "1.4.0"
  # python: "3.12"
  # go: "1.27"
  # php: "8.5"
  # rust: "1.98.0"
{{- end }}

# PHP extensions, installed on top of php-cli. Nothing is installed by
# default - list what your project actually needs.
# php:
#   extensions:
#     - sqlite3
#     - imagick

# Ports published from the sandbox to the host.
ports: []
  # - 3000
  # - "8080:80"
  # - "5432:5432/tcp"

# Inline environment variables.
env: {}
  # NODE_ENV: development

# Environment files, loaded in order; later files win. Inline 'env' above
# overrides all of them.
env_file: []
  # - .env
  # - .env.sandbox

# Network allowlist. Only these host patterns are reachable.
network: []
  # - "*.npmjs.org"
  # - "api.github.com"

# Commands run inside the sandbox at lifecycle points.
scripts:
  # Once, right after the sandbox is created.
  on_create: []
    # - pnpm install

  # On every start, including resume after a stop. Must be idempotent.
  on_start: []
    # - ./scripts/warm-cache.sh

# Cross-sandbox questions. Run the broker on your host with 'lid handoff -D',
# then the agent can ask agents in other sandboxes and answer theirs.
handoff:
  enabled: false
  # url: http://host.docker.internal:8787

# Host services reachable inside the sandbox under a stable name and port, so
# the project's .env needs no sandbox-specific edits. lid opens host_port in the
# sandbox's network policy and installs socat for you.
bridges: []
  # - name: postgres
  #   port: 5432
  #   host_port: 5432
  #   env: DB_HOST

# Host MCP servers the agent can use, by the names they were registered under
# with 'sbx mcp add'. The list is fixed when the sandbox is created, and an
# empty one gives the agent none: otherwise it could attach any server
# registered on your host, and local ones run outside the sandbox.
mcp: []
  # - gaia-my-project

# What 'lid shell' opens. A one-off 'lid shell -- <command>' gets the directory
# below; the aliases are for the interactive shell only.
shell:
  # Working directory when opening a shell.
  # directory: /home/agent/project

  # Aliases, added alongside the ones the image already defines.
  aliases: {}
    # g: git

# Claude Code customization. Ignored by other agents.
claude:
  # One of Claude Code's own themes - dark, light, dark-ansi, light-ansi,
  # dark-daltonized, light-daltonized - or a path to a theme file to install.
  # theme: dark

  plugins:
    marketplaces: []
      # - anthropics/claude-plugins-official
    install: []
      # - superpowers@claude-plugins-official

    # Installed when their marketplace is available, skipped otherwise: for
    # plugins from a local marketplace folder not everyone has. A local
    # marketplace whose folder is missing is skipped with a warning.
    install_optional: []
      # - gaia@pinktum

  # Merged into the agent's settings.json.
  settings: {}
    # alwaysThinkingEnabled: true

# Name for the terminal tab lid starts in, inside zellij or Herdr.
# display_name: my-project

# Let the agent open Herdr panes that run a command in this sandbox.
# Only takes effect inside Herdr, with the claude-code agent.
# herdr:
#   panes: true

# Instructions injected into the agent's memory file.
# memory: |
#   Project-specific instructions here.

# Keys for one backend only. Lists add to the shared ones above, maps merge,
# and single values replace. With a template: here, keep runtimes and
# scripts.on_start out of the shared config.
# backends:
#   nono:
#     paths:
#       read:
#         - ~/Developer/shared-lib
